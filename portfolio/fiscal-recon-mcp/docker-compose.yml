# Oracle Free container standing in for the legacy system, for integration
# tests of OracleSource. Seeded with synthetic data only.
#
#   docker compose up -d oracle
#   python scripts/seed_oracle.py
#   pytest -m integration
#
# SAP HANA has no lightweight free container, so HanaSource is covered by
# unit tests with an injected fake connection instead.

services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    environment:
      ORACLE_PASSWORD: devonly_change_me
      APP_USER: recon
      APP_USER_PASSWORD: recon_dev
    ports:
      - "1521:1521"
    volumes:
      - ./docker/oracle/init:/container-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 20
